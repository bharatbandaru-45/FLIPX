
<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Head or Tails</title>

<style>
* {
  margin: 0;
  padding: 0;
  box-sizing: border-box;
}

body {
  min-height: 100vh;
  display: flex;
  justify-content: center;
  align-items: center;
  background: #080816;
  color: white;
  font-family: Arial, sans-serif;
}

.game {
  text-align: center;
}

h1 {
  color: #00f5ff;
  margin-bottom: 35px;
  text-shadow: 0 0 15px #00f5ff;
}

.coin-area {
  perspective: 1000px;
  margin: 40px auto;
}

.coin {
  width: 150px;
  height: 150px;
  position: relative;
  margin: auto;
  transform-style: preserve-3d;
}

.side {
  position: absolute;
  inset: 0;
  border-radius: 50%;
  display: flex;
  justify-content: center;
  align-items: center;
  font-size: 25px;
  font-weight: bold;
  color: #332000;
  background: linear-gradient(135deg, #fff08a, #ffb700, #d88900);
  border: 7px solid #ffe36e;
  box-shadow: 0 0 25px #ffb700;
  backface-visibility: hidden;
}

.tails {
  transform: rotateY(180deg);
}

.coin.spinning {
  animation: flip 2s ease-in-out forwards;
}

@keyframes flip {
  from { transform: rotateY(0deg); }
  to { transform: rotateY(1800deg); }
}

button {
  padding: 14px 35px;
  background: #00f5ff;
  color: #080816;
  border: none;
  border-radius: 30px;
  font-size: 17px;
  font-weight: bold;
  cursor: pointer;
  box-shadow: 0 0 20px #00f5ff;
}

button:disabled {
  opacity: 0.5;
  cursor: not-allowed;
}

#result {
  margin-top: 25px;
  font-size: 25px;
  color: #ffcf40;
  min-height: 30px;
}
</style>
</head>

<body>
<div class="game">
  <h1>HEAD OR TAILS</h1>

  <div class="coin-area">
    <div class="coin" id="coin">
      <div class="side">HEAD</div>
      <div class="side tails">TAILS</div>
    </div>
  </div>

  <button id="spinBtn" onclick="spinCoin()">SPIN COIN</button>

  <div id="result">Ready to flip?</div>
</div>

<script>
const coin = document.getElementById("coin");
const button = document.getElementById("spinBtn");
const result = document.getElementById("result");

let spinning = false;

function spinCoin() {
  if (spinning) return;

  spinning = true;
  button.disabled = true;
  result.textContent = "Spinning...";

  const isHeads = Math.random() < 0.5;

  coin.classList.remove("spinning");

  // Reset animation
  coin.style.transform = isHeads
    ? "rotateY(0deg)"
    : "rotateY(180deg)";

  void coin.offsetWidth;

  coin.style.transform = "";
  coin.classList.add("spinning");

  setTimeout(() => {
    coin.classList.remove("spinning");

    coin.style.transform = isHeads
      ? "rotateY(1800deg)"
      : "rotateY(1980deg)";

    result.textContent = isHeads
      ? "🪙 HEADS!"
      : "🪙 TAILS!";

    button.disabled = false;
    spinning = false;
  }, 2000);
}
</script>
</body>
</html>
